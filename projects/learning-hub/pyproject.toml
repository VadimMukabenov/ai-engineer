[project]
name = "learning-hub"
version = "0.1.0"
description = "Versioned AI engineering curriculum, evidence and honest progress"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.18",
  "markdown>=3.7,<4",
  "openai>=2,<3"
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2", "ruff>=0.8"]

[project.scripts]
learning-hub = "learning_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
