{% extends 'base.html' %}{% block content %}<a class="back" href="/modules/{{lesson.module_id}}">Вернуться к модулю</a><header><h1>{{lesson.title}}</h1><p class="subtitle">{{lesson.id}} · версия {{report.course_version}}</p></header>
<article class="panel material">{{material|safe}}</article><section class="panel response"><h2>Твоя попытка</h2><p>Сохрани ответ или заметки о запуске. Отправка сохраняет попытку; зачёт выставляется после проверки по критериям.</p><form method="post" action="/lessons/{{lesson.id}}/attempts"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label for="kind">Что сохраняем?</label><select id="kind" name="kind"><option value="answer">Ответ или учебные заметки</option><option value="self_report">Самоотчёт о затруднении — без зачёта</option></select><label for="answer">Ответ, выводы и ссылки на файлы</label><textarea id="answer" name="answer" rows="12" maxlength="20000" required></textarea><label for="assistance">Какая помощь использовалась?</label><select id="assistance" name="assistance"><option value="unspecified">Не уточнено</option><option value="none">Самостоятельно</option><option value="documentation">Документация</option><option value="hint">Подсказки</option><option value="ai_partial">Часть решения от AI</option><option value="ai_solution">Решение от AI</option></select><button class="button primary" type="submit">Сохранить попытку</button></form></section>{% endblock %}
