name: Verify course foundation
"on":
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --project projects/learning-hub --dev
      - run: make verify
      - run: make test
      - name: Generated README and requirement matrix are current
        run: |
          make readme
          uv run --project projects/learning-hub learning-hub --root . market-export
          git diff --exit-code -- README.md research/market/requirement-matrix.csv
